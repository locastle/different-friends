: "大家"}, {"t": "o", "v": "! "}, {"t": "w", "v": "Our", "tr": "我们的"}, {"t": "o", "v": " "}, {"t": "w", "v": "football", "tr": "足球"}, {"t": "o", "v": " "}, {"t": "w", "v": "match", "tr": "比赛"}, {"t": "o", "v": " "}, {"t": "w", "v": "is", "tr": "是"}, {"t": "o", "v": " "}, {"t": "w", "v": "next", "tr": "下一个"}, {"t": "o", "v": " "}, {"t": "w", "v": "week", "tr": "星期"}, {"t": "o", "v": "."}]}, {"sp": "", "zh": "太好了！我们需要一张比赛海报。", "en": "Great! We need a poster for the match.", "tokens": [{"t": "w", "v": "Great", "tr": "太好了；很棒"}, {"t": "o", "v": "! "}, {"t": "w", "v": "We", "tr": "我们"}, {"t": "o", "v": " "}, {"t": "w", "v": "need", "tr": "需要"}, {"t": "o", "v": " "}, {"t": "w", "v": "a", "tr": "一个"}, {"t": "o", "v": " "}, {"t": "w", "v": "poster", "tr": "海报"}, {"t": "o", "v": " "}, {"t": "w", "v": "for", "tr": "为了；给"}, {"t": "o", "v": " "}, {"t": "w", "v": "the", "tr": "这（那）个"}, {"t": "o", "v": " "}, {"t": "w", "v": "match", "tr": "比赛"}, {"t": "o", "v": "."}]}, {"sp": "", "zh": "格蕾丝，你会画画吗？", "en": "Can you draw, Grace?", "tokens": [{"t": "w", "v": "Can", "tr": "能；会"}, {"t": "o", "v": " "}, {"t": "w", "v": "you", "tr": "你；你们"}, {"t": "o", "v": " "}, {"t": "w", "v": "draw", "tr": "画"}, {"t": "o", "v": ", "}, {"t": "w", "v": "Grace", "tr": "格蕾丝"}, {"t": "o", "v": "?"}]}, {"sp": "", "zh": "是的，我画得非常好。", "en": "Yes, I can draw really well.", "tokens": [{"t": "w", "v": "Yes", "tr": "是的"}, {"t": "o", "v": ", "}, {"t": "w", "v": "I", "tr": "我"}, {"t": "o", "v": " "}, {"t": "w", "v": "can", "tr": "能；会"}, {"t": "o", "v": " "}, {"t": "w", "v": "draw", "tr": "画"}, {"t": "o", "v": " "}, {"t": "w", "v": "really", "tr": "真正地；很"}, {"t": "o", "v": " "}, {"t": "w", "v": "well", "tr": "好地"}, {"t": "o", "v": "."}]}, {"sp": "", "zh": "谢谢你的帮助，格蕾丝。", "en": "Thank you for your help, Grace.", "tokens": [{"t": "w", "v": "Thank", "tr": "感谢"}, {"t": "o", "v": " "}, {"t": "w", "v": "you", "tr": "你；你们"}, {"t": "o", "v": " "}, {"t": "w", "v": "for", "tr": "为了；给"}, {"t": "o", "v": " "}, {"t": "w", "v": "you <script>
const DATA = window.__DATA__;
const reader = document.getElementById('reader');
const pageImg = document.getElementById('pageImg');
const boardBar = document.getElementById('boardBar');
const ind = document.getElementById('ind');
const btnPrev = document.getElementById('prev');
const btnNext = document.getElementById('next');
const bubble = document.getElementById('bubble');
let cur = 0;

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=.9; u.pitch=1;
  window.speechSynthesis.speak(u);
}

function showBubble(el, zh, en){
  bubble.innerHTML = '';
  const d = document.createElement('div'); d.textContent = zh; bubble.appendChild(d);
  if(en){ const s=document.createElement('span'); s.className='bz'; s.textContent=en; bubble.appendChild(s); }
  bubble.classList.add('show');
  const r = el.getBoundingClientRect();
  const br = bubble.getBoundingClientRect();
  const m = 12;
  let top = r.top - br.height - m;
  bubble.classList.remove('bubble-bottom');
  if(top < m){ top = r.bottom + m; bubble.classList.add('bubble-bottom'); }
  let left = r.left + r.width/2 - br.width/2;
  left = Math.max(12, Math.min(window.innerWidth - br.width - 12, left));
  bubble.style.top = top+'px'; bubble.style.left = left+'px';
  requestAnimationFrame(()=>{
    const b2 = bubble.getBoundingClientRect();
    let nl = r.left + r.width/2 - b2.width/2;
    nl = Math.max(12, Math.min(window.innerWidth - b2.width - 12, nl));
    bubble.style.left = nl+'px';
  });
}
function hideBubble(){ bubble.classList.remove('show'); }
function flash(el){ el.classList.add('playing'); setTimeout(()=>el.classList.remove('playing'),400); }

function setup(el, enText, zhText){
  let timer=null, longPress=false;
  const LONG=500;
  const start = e => {
    longPress=false; clearTimeout(timer);
    timer=setTimeout(()=>{ longPress=true; showBubble(el, zhText, null); }, LONG);
  };
  const end = e => {
    clearTimeout(timer);
    if(longPress) return;
    speak(enText); showBubble(el, zhText, null); flash(el);
  };
  const cancel = () => clearTimeout(timer);
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('mouseup', end);
  el.addEventListener('touchend', end);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e=>e.preventDefault());
}

function renderPage(i){
  const p = DATA.pages[i];
  pageImg.src = p.img;
  pageImg.alt = 'Unit 1 课本第 ' + p.book + ' 页';
  boardBar.textContent = p.board;
  ind.textContent = (i+1) + ' / ' + DATA.pages.length + '　课本 P' + p.book;
  btnPrev.disabled = i===0;
  btnNext.disabled = i===DATA.pages.length-1;
  reader.innerHTML = '';

  p.blocks.forEach(blk=>{
    const sec = document.createElement('div');
    sec.className = 'read-section';

    const lb = document.createElement('div');
    lb.className = 'section-label'; lb.textContent = blk.label;
    sec.appendChild(lb);

    blk.sentences.forEach(s=>{
      const wrap = document.createElement('div');
      wrap.className = 'sentence';
      if(s.sp){
        const sp = document.createElement('span');
        sp.className='sp'; sp.textContent = s.sp;
        wrap.appendChild(sp);
      }
      const line = document.createElement('div');
      line.className = 'en';
      s.tokens.forEach(t=>{
        if(t.t === 'o'){ line.appendChild(document.createTextNode(t.v)); return; }
        const sp2 = document.createElement('span');
        sp2.className = 'w'; sp2.textContent = t.v;
        if(t.tr){
          setup(sp2, t.v, t.tr);
          ['mousedown','touchstart','mouseup','touchend'].forEach(ev=>
            sp2.addEventListener(ev, e=>e.stopPropagation()));
        }
        line.appendChild(sp2);
      });
      setup(line, s.en, s.zh);
      wrap.appendChild(line);

      const zh = document.createElement('div');
      zh.className='zh'; zh.textContent = s.zh;
      wrap.appendChild(zh);
      sec.appendChild(wrap);
    });

    if(blk.words.length){
      const row = document.createElement('div');
      row.className = 'words-row';
      blk.words.forEach(w=>{
        const c = document.createElement('span');
        c.className='wchip'; c.textContent = w.w;
        if(w.tr){ setup(c, w.w, w.tr); }
        row.appendChild(c);
      });
      sec.appendChild(row);
    }
    reader.appendChild(sec);
  });

  const g = document.createElement('div');
  g.className='guide';
  g.innerHTML = '💡 <b>用法：</b>点击句子里的任意单词 → 朗读该词并在上方显示中文；<b>长按</b>单词 → 只看翻译，不朗读；点击句子空白处 → 朗读整句。';
  reader.appendChild(g);
  hideBubble();
  window.scrollTo({top:0, behavior:'smooth'});
}

btnPrev.onclick = ()=>{ if(cur>0){ cur--; renderPage(cur); } };
btnNext.onclick = ()=>{ if(cur<DATA.pages.length-1){ cur++; renderPage(cur); } };
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'){ btnPrev.click(); }
  if(e.key==='ArrowRight'){ btnNext.click(); }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.w') && !e.target.closest('.en') && !e.target.closest('.wchip') && !e.target.closest('.bubble')) hideBubble();
});
window.addEventListener('scroll', hideBubble, true);
window.addEventListener('resize', hideBubble);

renderPage(0);
</script>
</body>
</html>
